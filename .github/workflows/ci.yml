name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
          cache: true
      - run: npm ci
      - run: deno check supabase/functions/verify-license/index.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
